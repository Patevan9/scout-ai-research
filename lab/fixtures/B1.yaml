expected:
  behavior_summary: >-
    Resolves "her" to Diana from the conversation and returns Diana's
    birthday from the retrieved fact, without asking who is meant.
  unacceptable_behavior: >-
    Asking "who do you mean?" when the referent was unambiguous, or
    answering about a different/wrong entity.
